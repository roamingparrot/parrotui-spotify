[package]
name = "parrotui-spotify"
version = "0.2.0"
edition = "2024"
authors = ["parrotui contributors"]
description = "A keyboard-driven Spotify client for the terminal"
license = "MIT"
repository = "https://github.com/roamingparrot/parrotui-spotify"
readme = "README.md"
keywords = ["spotify", "tui", "terminal", "music"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
dirs = "6"
open = "5"
rand = "0.8"
sha2 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
color-eyre = "0.6"
unicode-width = "0.2"

# Audio playback via librespot (pinned by Cargo.lock)
librespot-core = { git = "https://github.com/librespot-org/librespot", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
